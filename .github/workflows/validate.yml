name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression and package checks
        run: python -m unittest discover -s tests -v
      - name: Check Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/render_word.ps1'), [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
